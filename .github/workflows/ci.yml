name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: .NET kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Bağımlılıkları yükle
        run: dotnet restore ./TaskManagerAPI/TaskManagerAPI.csproj

      - name: Build et
        run: dotnet build ./TaskManagerAPI/TaskManagerAPI.csproj --no-restore
      - name: Testleri çalıştır
        run: dotnet test ./TaskManagerAPI.Tests/TaskManagerAPI.Tests.csproj --no-build --verbosity normal
      - name: Docker Hub'a giriş yap
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker image build et ve gönder
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./TaskManagerAPI
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/taskmanager-api:latest

      - name: Railway'e deploy et
        if: github.ref == 'refs/heads/main'
        run: |
          npm install -g @railway/cli
          railway redeploy --service taskmanager-api --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
