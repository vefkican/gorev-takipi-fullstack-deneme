name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: taskmanagerdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: .NET kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Bağımlılıkları yükle
        run: dotnet restore ./TaskManagerAPI/TaskManagerAPI.csproj

      - name: Build et
        run: dotnet build ./TaskManagerAPI/TaskManagerAPI.csproj --no-restore

      - name: Docker image build et
        run: docker build -t taskmanager-api ./TaskManagerAPI
